[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrace-research"
version = "0.51.0"
description = "Independent research ABIF/FSA electropherogram viewer and analysis prototype"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenTrace contributors"}]

[project.scripts]
opentrace = "genemapper_open.__main__:main"

[tool.setuptools.package-data]
genemapper_open = ["web/*.html", "web/idx/*.html", "web/idx/*.css", "web/idx/*.js"]

[tool.setuptools.packages.find]
include = ["genemapper_open*"]
