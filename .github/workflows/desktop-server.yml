name: desktop-server

# Builds and tests the analysis core, OpenTrace Server and OpenTrace Desktop on Linux and Windows.
on:
  push:
    branches: [feature/desktop-server-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build opentrace
        run: cargo build --release --locked --manifest-path core/opentrace-core/Cargo.toml --bin opentrace
      - name: Tests (bit-identical to the reference on every OS; libm_port makes exp/log/pow platform-independent)
        run: cargo test --release --locked --no-fail-fast --manifest-path core/opentrace-core/Cargo.toml
      - name: libm_port against glibc on 1e8 arguments (Linux)
        if: runner.os == 'Linux'
        env:
          LIBM_PORT_CASES: "100000000"
        run: cargo test --release --locked --manifest-path core/opentrace-core/Cargo.toml --test libm_port

  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/opentrace-server
      - name: Unit and API tests
        run: cargo test --locked --manifest-path server/opentrace-server/Cargo.toml
      - name: Release binary
        run: cargo build --release --locked --manifest-path server/opentrace-server/Cargo.toml
      - name: Debian package, installed and started as the service user (Linux)
        if: runner.os == 'Linux'
        run: |
          sh server/opentrace-server/packaging/deb/build-deb.sh
          sudo dpkg -i server/opentrace-server/target/release/opentrace-server_*.deb
          sudo -u opentrace env OPENTRACE_NEW_PASSWORD=ci-secret-1 opentrace-server set-password Administrator --config /etc/opentrace/server.toml
          sudo -u opentrace opentrace-server serve --config /etc/opentrace/server.toml > server-deb.log 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:8770/api/v1/health && break; sleep 0.3; done
          curl -fs -X POST http://127.0.0.1:8770/api/v1/auth/login -H 'content-type: application/json' -d '{"username":"Administrator","password":"ci-secret-1"}' > /dev/null
          systemd-analyze verify /lib/systemd/system/opentrace-server.service
          sudo pkill -u opentrace -f 'opentrace-server serve' || true
          sleep 1
          sudo dpkg --purge opentrace-server
          sudo test -f /var/lib/opentrace-server/opentrace.sqlite3   # data survives purge
      - name: Windows server folder (exe + resources + configuration example + scripts)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "server/opentrace-server/target/release/opentrace-server-windows"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item server/opentrace-server/target/release/opentrace-server.exe $d
          Copy-Item -Recurse resources "$d/resources"
          Copy-Item server/opentrace-server/packaging/opentrace-server.example.toml $d
          Copy-Item server/opentrace-server/packaging/windows/* $d -Exclude *.nsi
          & "$d/opentrace-server.exe" version
      - name: Windows service under the Service Control Manager (install, start, API, restart after a crash, stop, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $d = (Resolve-Path server/opentrace-server/target/release/opentrace-server-windows).Path
          $exe = Join-Path $d 'opentrace-server.exe'
          $name = 'OpenTraceServerCI'
          $data = Join-Path $env:RUNNER_TEMP 'ots-svc-data'
          $cfgDir = Join-Path $env:RUNNER_TEMP 'ots-svc-config'
          New-Item -ItemType Directory -Force $data, $cfgDir | Out-Null
          $cfg = Join-Path $cfgDir 'server.toml'
          "listen = `"127.0.0.1:18790`"`ntransport = `"http`"`nallow_insecure_http = true`ndata_dir = '$data'`nallowed_hosts = [`"127.0.0.1`", `"localhost`"]`n" | Set-Content -Encoding utf8NoBOM $cfg
          $env:OPENTRACE_NEW_PASSWORD = 'ci-secret-1'
          & $exe set-password Administrator --config $cfg
          Remove-Item Env:OPENTRACE_NEW_PASSWORD
          & $exe service-install --config $cfg --name $name
          if ($LASTEXITCODE -ne 0) { throw "service-install failed" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='$name'"
          "account: $($svc.StartName); start: $($svc.StartMode); path: $($svc.PathName)"
          if ($svc.StartName -ne "NT SERVICE\$name") { throw "unexpected service account $($svc.StartName)" }
          sc.exe qfailure $name
          function Wait-Health([int]$seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try { return Invoke-RestMethod http://127.0.0.1:18790/api/v1/health } catch { Start-Sleep 1 }
            }
            return $null
          }
          function Show-Logs { sc.exe query $name; Get-Content (Join-Path $data 'logs\server.log') -ErrorAction SilentlyContinue | Select-Object -Last 40 }
          sc.exe start $name | Out-Null
          if (-not (Wait-Health 60)) { Show-Logs; throw 'service did not answer' }
          # Login writes a session into the database: the virtual account can write its data directory.
          $login = Invoke-RestMethod -Method Post http://127.0.0.1:18790/api/v1/auth/login -ContentType 'application/json' -Body '{"username":"Administrator","password":"ci-secret-1"}'
          if (-not $login.token) { throw 'login failed' }
          if (-not (Test-Path (Join-Path $data 'logs\server.log'))) { throw 'no service log' }
          # A crash (process killed) must be followed by the configured restart (first action: after 10 s).
          $pid1 = (Get-CimInstance Win32_Service -Filter "Name='$name'").ProcessId
          Stop-Process -Id $pid1 -Force
          Start-Sleep 3
          if (-not (Wait-Health 60)) { Show-Logs; throw 'service was not restarted after a crash' }
          $pid2 = (Get-CimInstance Win32_Service -Filter "Name='$name'").ProcessId
          if ($pid2 -eq $pid1) { throw 'same process after the crash?' }
          "restarted after crash: pid $pid1 -> $pid2"
          sc.exe stop $name | Out-Null
          for ($i = 0; $i -lt 30 -and (Get-Service $name).Status -ne 'Stopped'; $i++) { Start-Sleep 1 }
          if ((Get-Service $name).Status -ne 'Stopped') { Show-Logs; throw 'service did not stop' }
          Get-Content (Join-Path $data 'logs\server.log') | Select-String 'stop requested' | Select-Object -Last 1
          & $exe service-uninstall --name $name
          if (Get-Service $name -ErrorAction SilentlyContinue) { throw 'service still registered' }
          if (-not (Test-Path (Join-Path $data 'opentrace.sqlite3'))) { throw 'data directory not kept' }
          'Windows service: OK'
      - name: Windows server installer (NSIS) - silent install, start, upgrade in place, uninstall keeps data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path server/opentrace-server/target/release/opentrace-server-windows).Path
          $ver = (Select-String -Path server/opentrace-server/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $out = Join-Path (Resolve-Path server/opentrace-server/target/release).Path "OpenTrace-Server-$ver-x64-setup.exe"
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { choco install nsis -y --no-progress | Out-Null; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsis /V2 "/DVERSION=$ver" "/DSRC=$src" "/DOUT=$out" server/opentrace-server/packaging/windows/opentrace-server.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          $p = Start-Process -FilePath $out -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $inst = Join-Path $env:ProgramFiles 'OpenTrace Server'
          $cfg = Join-Path $env:ProgramData 'OpenTrace\server.toml'
          foreach ($f in @("$inst\opentrace-server.exe", "$inst\resources\web\index.html", "$inst\uninstall.exe", $cfg)) { if (-not (Test-Path $f)) { throw "missing $f" } }
          $svc = Get-CimInstance Win32_Service -Filter "Name='OpenTraceServer'"
          "service: $($svc.StartName) $($svc.StartMode) $($svc.State)"
          if (-not $svc -or $svc.State -ne 'Stopped') { throw 'service not registered or not stopped after the first install' }
          $env:OPENTRACE_NEW_PASSWORD = 'ci-secret-2'
          & "$inst\opentrace-server.exe" set-password Administrator --config $cfg
          Remove-Item Env:OPENTRACE_NEW_PASSWORD
          sc.exe start OpenTraceServer | Out-Null
          function Wait-Up { for ($i = 0; $i -lt 60; $i++) { try { return Invoke-RestMethod http://127.0.0.1:8770/api/v1/health } catch { Start-Sleep 1 } }; return $null }
          if (-not (Wait-Up)) { Get-Content "$env:ProgramData\OpenTrace\server\logs\server.log" -ErrorAction SilentlyContinue; throw 'installed service did not answer' }
          $t = (Invoke-RestMethod -Method Post http://127.0.0.1:8770/api/v1/auth/login -ContentType 'application/json' -Body '{"username":"Administrator","password":"ci-secret-2"}').token
          if (-not $t) { throw 'login failed' }
          # Upgrade in place while running: configuration and data kept, service running again.
          Add-Content $cfg "`n# local edit kept on upgrade"
          $p = Start-Process -FilePath $out -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $cfg -Pattern 'local edit kept on upgrade' -Quiet)) { throw 'configuration overwritten by the upgrade' }
          if (-not (Wait-Up)) { throw 'service not running after the upgrade' }
          $t = (Invoke-RestMethod -Method Post http://127.0.0.1:8770/api/v1/auth/login -ContentType 'application/json' -Body '{"username":"Administrator","password":"ci-secret-2"}').token
          if (-not $t) { throw 'login after the upgrade failed (password lost?)' }
          # Uninstall: service and program files removed, laboratory data kept.
          $p = Start-Process -FilePath "$inst\uninstall.exe" -ArgumentList '/S', "_?=$inst" -Wait -PassThru
          if (Get-Service OpenTraceServer -ErrorAction SilentlyContinue) { throw 'service still registered after uninstall' }
          if (Test-Path "$inst\opentrace-server.exe") { throw 'program files left' }
          if (-not (Test-Path "$env:ProgramData\OpenTrace\server\opentrace.sqlite3")) { throw 'laboratory data removed' }
          if (-not (Test-Path $cfg)) { throw 'configuration removed' }
          'Windows installer: OK'
      - uses: actions/upload-artifact@v4
        with:
          name: opentrace-server-${{ runner.os }}
          path: |
            server/opentrace-server/target/release/opentrace-server
            server/opentrace-server/target/release/opentrace-server.exe
            server/opentrace-server/target/release/opentrace-server_*.deb
            server/opentrace-server/target/release/opentrace-server-windows/
            server/opentrace-server/target/release/OpenTrace-Server-*-setup.exe
          if-no-files-found: ignore

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # Windows: line tables go into the separate PDB (the exe is unchanged in size), so stacks of user hang/crash dumps
      # can be read; Linux keeps release binaries without debug info.
      CARGO_PROFILE_RELEASE_DEBUG: ${{ matrix.os == 'windows-2022' && 'line-tables-only' || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/opentrace-desktop/src-tauri
      - name: Linux system libraries (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: cargo test --locked --manifest-path desktop/opentrace-desktop/src-tauri/Cargo.toml
      - name: Build (debug) for the self-test
        run: cargo build --locked --manifest-path desktop/opentrace-desktop/src-tauri/Cargo.toml
      - name: Self-test in a real webview (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          OPENTRACE_DESKTOP_SELFTEST=$PWD/selftest.json timeout 180 xvfb-run -a desktop/opentrace-desktop/src-tauri/target/debug/opentrace-desktop
          cat selftest.json
      - name: End-to-end with a real OpenTrace Server (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --manifest-path server/opentrace-server/Cargo.toml
          BIN=server/opentrace-server/target/release/opentrace-server
          export OPENTRACE_SERVER_DATA_DIR=$RUNNER_TEMP/ots OPENTRACE_SERVER_TRANSPORT=http OPENTRACE_SERVER_LISTEN=127.0.0.1:18770
          OPENTRACE_NEW_PASSWORD=e2e-secret-1 $BIN set-password "Casework Analyst"
          OPENTRACE_NEW_PASSWORD=e2e-secret-1 $BIN set-password "Lab Director"
          $BIN grant-approver "Lab Director"
          $BIN serve > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:18770/api/v1/health && break; sleep 0.5; done
          for run in 1 2; do
            OPENTRACE_DESKTOP_SELFTEST=$PWD/e2e$run.json OPENTRACE_SELFTEST_SERVER_URL=http://127.0.0.1:18770 \
              OPENTRACE_SELFTEST_USER="Casework Analyst" OPENTRACE_SELFTEST_PASSWORD=e2e-secret-1 \
              timeout 180 xvfb-run -a desktop/opentrace-desktop/src-tauri/target/debug/opentrace-desktop
          done
          # first client uploads, second one is deduplicated by SHA-256: one stored file per distinct FSA (the analysed
          # self-test file and the sample of the local-draft check)
          test "$(find $RUNNER_TEMP/ots/fsa -type f | wc -l)" = 2
          grep -q '"deduplicated": 1' e2e2.json
          # Laboratory profile with the synthetic kit; genotyping through the UI, saved to the server: every sample's
          # provenance must be attributed to the profile.
          cargo run -q --manifest-path core/opentrace-core/Cargo.toml --example synthetic_kit_store > $RUNNER_TEMP/kit.json
          PROFILE=$(python3 desktop/opentrace-desktop/tests/e2e/setup_lab_profile.py http://127.0.0.1:18770 e2e-secret-1 resources/data/shipped_methods.json $RUNNER_TEMP/kit.json)
          OPENTRACE_DESKTOP_SELFTEST=$PWD/e2e-genotype.json OPENTRACE_SELFTEST_SERVER_URL=http://127.0.0.1:18770 \
            OPENTRACE_SELFTEST_USER="Casework Analyst" OPENTRACE_SELFTEST_PASSWORD=e2e-secret-1 \
            OPENTRACE_SELFTEST_PROFILE="$PROFILE" OPENTRACE_DESKTOP_SELFTEST_GENOTYPE=4 \
            timeout 600 xvfb-run -a desktop/opentrace-desktop/src-tauri/target/debug/opentrace-desktop
          python3 -c "import json; g=json.load(open('e2e-genotype.json'))['main']['genotype']; print({k: g.get(k) for k in ('markers_ok', 'mismatches', 'provenance')})"
      - name: WebView2 runtime (Windows, update to current Evergreen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The image's runtime (131) does not route popup requests to the app scheme; users get Evergreen updates.
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile MicrosoftEdgeWebview2Setup.exe
          Start-Process -FilePath .\MicrosoftEdgeWebview2Setup.exe -ArgumentList '/silent','/install' -Wait
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') {
            if (Test-Path $k) { "WebView2 runtime: " + (Get-ItemProperty $k).pv }
          }
      - name: Self-test in a real webview (Windows, WebView2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENTRACE_DESKTOP_SELFTEST = "$PWD\selftest.json"
          $env:OPENTRACE_DESKTOP_TRACE = "1"
          $p = Start-Process -FilePath desktop\opentrace-desktop\src-tauri\target\debug\opentrace-desktop.exe -PassThru -Wait -RedirectStandardError selftest-stderr.txt
          Get-Content selftest.json
          Get-Content selftest-stderr.txt | Select-String -NotMatch 'sync/status|workspace/status' | Select-Object -First 200
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          # Genotyping through the UI with the synthetic kit and ladder (calls compared with the truth).
          $env:OPENTRACE_DESKTOP_SELFTEST = "$PWD\selftest-genotype.json"
          $env:OPENTRACE_DESKTOP_SELFTEST_GENOTYPE = "4"
          $p = Start-Process -FilePath desktop\opentrace-desktop\src-tauri\target\debug\opentrace-desktop.exe -PassThru -Wait
          Get-Content selftest-genotype.json | Select-String -Pattern '"pass"|markers_ok|mismatches'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-selftest-${{ runner.os }}
          path: |
            selftest.json
            selftest-genotype.json
            selftest-stderr.txt
          if-no-files-found: ignore
      - name: Installers
        working-directory: desktop/opentrace-desktop
        run: |
          npm install --no-audit --no-fund
          npx tauri build ${{ runner.os == 'Windows' && '--bundles nsis msi' || '--bundles deb appimage' }}
      - name: Installed NSIS and MSI packages pass the self-test, then uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path desktop/opentrace-desktop/src-tauri/target/release/bundle).Path
          function Test-Installed([string]$exe, [string]$tag) {
            if (-not (Test-Path $exe)) { throw "${tag}: $exe missing" }
            $env:OPENTRACE_DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP "ot-installed-$tag"
            $env:OPENTRACE_DESKTOP_SELFTEST = Join-Path $env:RUNNER_TEMP "selftest-installed-$tag.json"
            $p = Start-Process -FilePath $exe -PassThru -Wait
            $j = Get-Content $env:OPENTRACE_DESKTOP_SELFTEST -Raw | ConvertFrom-Json
            "$tag self-test pass: $($j.pass) (exit $($p.ExitCode))"
            if (-not $j.pass) { Get-Content $env:OPENTRACE_DESKTOP_SELFTEST; throw "${tag}: self-test of the installed app failed" }
            Remove-Item Env:OPENTRACE_DESKTOP_DATA_DIR, Env:OPENTRACE_DESKTOP_SELFTEST
          }
          # NSIS (per user, %LOCALAPPDATA%)
          $setup = Get-ChildItem "$bundle\nsis\*-setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS install exit $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'OpenTrace Desktop'
          Test-Installed "$dir\opentrace-desktop.exe" 'nsis'
          $p = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if (Test-Path "$dir\opentrace-desktop.exe") { throw 'NSIS uninstall left the program' }
          # MSI (per machine, Program Files)
          $msi = Get-ChildItem "$bundle\msi\*.msi" | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 40; throw "MSI install exit $($p.ExitCode)" }
          Select-String -Path "$env:RUNNER_TEMP\msi-install.log" -Pattern 'Property\(S\): (INSTALLDIR|APPLICATIONFOLDER|ALLUSERS)' | Select-Object -First 5 | ForEach-Object { $_.Line }
          $installed = @("$env:ProgramFiles\OpenTrace Desktop", "${env:ProgramFiles(x86)}\OpenTrace Desktop", "$env:LOCALAPPDATA\OpenTrace Desktop", "$env:LOCALAPPDATA\Programs\OpenTrace Desktop") |
            ForEach-Object { Join-Path $_ 'opentrace-desktop.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          "MSI installed: $installed"
          if (-not $installed) { Get-ChildItem -Path $env:ProgramFiles, $env:LOCALAPPDATA -Filter opentrace-desktop.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }; throw 'MSI: installed program not found' }
          Test-Installed $installed 'msi'
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall exit $($p.ExitCode)" }
          if (Test-Path $installed) { throw 'MSI uninstall left the program' }
          'Installed packages: OK'
      - uses: actions/upload-artifact@v4
        with:
          name: opentrace-desktop-${{ runner.os }}
          path: |
            desktop/opentrace-desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/opentrace-desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/opentrace-desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/opentrace-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
      # Debug symbols of the shipped Windows binary: needed to read stacks of hang/crash dumps from users.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: opentrace-desktop-Windows-symbols
          path: |
            desktop/opentrace-desktop/src-tauri/target/release/opentrace_desktop.pdb
            desktop/opentrace-desktop/src-tauri/target/release/opentrace-desktop.exe
          if-no-files-found: warn
