name: desktop-server

# Builds and tests the analysis core, OpenTrace Server and OpenTrace Desktop on Linux and Windows.
on:
  push:
    branches: [feature/desktop-server-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build opentrace
        run: cargo build --release --locked --manifest-path core/opentrace-core/Cargo.toml --bin opentrace
      - name: Tests (bit-identical to the reference on every OS; libm_port makes exp/log/pow platform-independent)
        run: cargo test --release --locked --no-fail-fast --manifest-path core/opentrace-core/Cargo.toml
      - name: libm_port against glibc on 1e8 arguments (Linux)
        if: runner.os == 'Linux'
        env:
          LIBM_PORT_CASES: "100000000"
        run: cargo test --release --locked --manifest-path core/opentrace-core/Cargo.toml --test libm_port

  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/opentrace-server
      - name: Unit and API tests
        run: cargo test --locked --manifest-path server/opentrace-server/Cargo.toml
      - name: Release binary
        run: cargo build --release --locked --manifest-path server/opentrace-server/Cargo.toml
      - name: Debian package, installed and started as the service user (Linux)
        if: runner.os == 'Linux'
        run: |
          sh server/opentrace-server/packaging/deb/build-deb.sh
          sudo dpkg -i server/opentrace-server/target/release/opentrace-server_*.deb
          sudo -u opentrace env OPENTRACE_NEW_PASSWORD=ci-secret-1 opentrace-server set-password Administrator --config /etc/opentrace/server.toml
          sudo -u opentrace opentrace-server serve --config /etc/opentrace/server.toml > server-deb.log 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:8770/api/v1/health && break; sleep 0.3; done
          curl -fs -X POST http://127.0.0.1:8770/api/v1/auth/login -H 'content-type: application/json' -d '{"username":"Administrator","password":"ci-secret-1"}' > /dev/null
          systemd-analyze verify /lib/systemd/system/opentrace-server.service
          sudo pkill -u opentrace -f 'opentrace-server serve' || true
          sleep 1
          sudo dpkg --purge opentrace-server
          sudo test -f /var/lib/opentrace-server/opentrace.sqlite3   # data survives purge
      - name: Windows server folder (exe + resources + configuration example + scripts)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "server/opentrace-server/target/release/opentrace-server-windows"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item server/opentrace-server/target/release/opentrace-server.exe $d
          Copy-Item -Recurse resources "$d/resources"
          Copy-Item server/opentrace-server/packaging/opentrace-server.example.toml $d
          Copy-Item server/opentrace-server/packaging/windows/* $d
          & "$d/opentrace-server.exe" version
      - uses: actions/upload-artifact@v4
        with:
          name: opentrace-server-${{ runner.os }}
          path: |
            server/opentrace-server/target/release/opentrace-server
            server/opentrace-server/target/release/opentrace-server.exe
            server/opentrace-server/target/release/opentrace-server_*.deb
            server/opentrace-server/target/release/opentrace-server-windows/
          if-no-files-found: ignore

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/opentrace-desktop/src-tauri
      - name: Linux system libraries (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: cargo test --locked --manifest-path desktop/opentrace-desktop/src-tauri/Cargo.toml
      - name: Build (debug) for the self-test
        run: cargo build --locked --manifest-path desktop/opentrace-desktop/src-tauri/Cargo.toml
      - name: Self-test in a real webview (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          OPENTRACE_DESKTOP_SELFTEST=$PWD/selftest.json timeout 180 xvfb-run -a desktop/opentrace-desktop/src-tauri/target/debug/opentrace-desktop
          cat selftest.json
      - name: End-to-end with a real OpenTrace Server (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --manifest-path server/opentrace-server/Cargo.toml
          BIN=server/opentrace-server/target/release/opentrace-server
          export OPENTRACE_SERVER_DATA_DIR=$RUNNER_TEMP/ots OPENTRACE_SERVER_TRANSPORT=http OPENTRACE_SERVER_LISTEN=127.0.0.1:18770
          OPENTRACE_NEW_PASSWORD=e2e-secret-1 $BIN set-password "Casework Analyst"
          OPENTRACE_NEW_PASSWORD=e2e-secret-1 $BIN set-password "Lab Director"
          $BIN grant-approver "Lab Director"
          $BIN serve > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:18770/api/v1/health && break; sleep 0.5; done
          for run in 1 2; do
            OPENTRACE_DESKTOP_SELFTEST=$PWD/e2e$run.json OPENTRACE_SELFTEST_SERVER_URL=http://127.0.0.1:18770 \
              OPENTRACE_SELFTEST_USER="Casework Analyst" OPENTRACE_SELFTEST_PASSWORD=e2e-secret-1 \
              timeout 180 xvfb-run -a desktop/opentrace-desktop/src-tauri/target/debug/opentrace-desktop
          done
          # first client uploads, second one is deduplicated by SHA-256: exactly one stored file
          test "$(find $RUNNER_TEMP/ots/fsa -type f | wc -l)" = 1
          grep -q '"deduplicated": 1' e2e2.json
          # Laboratory profile with the synthetic kit; genotyping through the UI, saved to the server: every sample's
          # provenance must be attributed to the profile.
          cargo run -q --manifest-path core/opentrace-core/Cargo.toml --example synthetic_kit_store > $RUNNER_TEMP/kit.json
          PROFILE=$(python3 desktop/opentrace-desktop/tests/e2e/setup_lab_profile.py http://127.0.0.1:18770 e2e-secret-1 resources/data/shipped_methods.json $RUNNER_TEMP/kit.json)
          OPENTRACE_DESKTOP_SELFTEST=$PWD/e2e-genotype.json OPENTRACE_SELFTEST_SERVER_URL=http://127.0.0.1:18770 \
            OPENTRACE_SELFTEST_USER="Casework Analyst" OPENTRACE_SELFTEST_PASSWORD=e2e-secret-1 \
            OPENTRACE_SELFTEST_PROFILE="$PROFILE" OPENTRACE_DESKTOP_SELFTEST_GENOTYPE=4 \
            timeout 600 xvfb-run -a desktop/opentrace-desktop/src-tauri/target/debug/opentrace-desktop
          python3 -c "import json; g=json.load(open('e2e-genotype.json'))['main']['genotype']; print({k: g.get(k) for k in ('markers_ok', 'mismatches', 'provenance')})"
      - name: WebView2 runtime (Windows, update to current Evergreen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The image's runtime (131) does not route popup requests to the app scheme; users get Evergreen updates.
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile MicrosoftEdgeWebview2Setup.exe
          Start-Process -FilePath .\MicrosoftEdgeWebview2Setup.exe -ArgumentList '/silent','/install' -Wait
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') {
            if (Test-Path $k) { "WebView2 runtime: " + (Get-ItemProperty $k).pv }
          }
      - name: Self-test in a real webview (Windows, WebView2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENTRACE_DESKTOP_SELFTEST = "$PWD\selftest.json"
          $env:OPENTRACE_DESKTOP_TRACE = "1"
          $p = Start-Process -FilePath desktop\opentrace-desktop\src-tauri\target\debug\opentrace-desktop.exe -PassThru -Wait -RedirectStandardError selftest-stderr.txt
          Get-Content selftest.json
          Get-Content selftest-stderr.txt | Select-String -NotMatch 'sync/status|workspace/status' | Select-Object -First 200
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          # Genotyping through the UI with the synthetic kit and ladder (calls compared with the truth).
          $env:OPENTRACE_DESKTOP_SELFTEST = "$PWD\selftest-genotype.json"
          $env:OPENTRACE_DESKTOP_SELFTEST_GENOTYPE = "4"
          $p = Start-Process -FilePath desktop\opentrace-desktop\src-tauri\target\debug\opentrace-desktop.exe -PassThru -Wait
          Get-Content selftest-genotype.json | Select-String -Pattern '"pass"|markers_ok|mismatches'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-selftest-${{ runner.os }}
          path: |
            selftest.json
            selftest-genotype.json
            selftest-stderr.txt
          if-no-files-found: ignore
      - name: Installers
        working-directory: desktop/opentrace-desktop
        run: |
          npm install --no-audit --no-fund
          npx tauri build ${{ runner.os == 'Windows' && '--bundles nsis msi' || '--bundles deb appimage' }}
      - uses: actions/upload-artifact@v4
        with:
          name: opentrace-desktop-${{ runner.os }}
          path: |
            desktop/opentrace-desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/opentrace-desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/opentrace-desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/opentrace-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
