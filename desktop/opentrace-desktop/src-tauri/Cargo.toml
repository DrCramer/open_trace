[package]
name = "opentrace-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenTrace Desktop: Tauri 2 shell around the existing OpenTrace web UI with the analysis core in-process"
publish = false

# Standalone workspace: keeps core/Cargo.lock (used by the Docker image) free of GUI dependencies.
[workspace]

[lib]
name = "opentrace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opentrace-core = { path = "../../../core/opentrace-core" }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls", "gzip"] }
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native", "linux-native"] }
sha2 = "0.10"
flate2 = "1"
url = "2"
percent-encoding = "2"

[dev-dependencies]
# Integration tests run the real OpenTrace Server in-process.
opentrace-server = { path = "../../../server/opentrace-server" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(target_os = "linux")'.dependencies]
# Same version as wry's: only used to align WebKitGTK popup settings with WebView2.
webkit2gtk = "2.0"
