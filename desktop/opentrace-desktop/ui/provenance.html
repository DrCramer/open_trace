<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenTrace — происхождение анализов</title>
<link rel="stylesheet" href="/idx/idx.css">
<style>
 body{padding:0;overflow:auto}
 main{padding:10px 14px}
 h1{font-size:15px;margin:2px 0 8px}
 table.g{width:100%}
 table.g tr.sel td{background:#cfe2ff;color:#000}
 pre{background:#f7f7f7;border:1px solid #ddd;padding:6px;max-height:300px;overflow:auto;font-size:11px}
 .err{color:#b00000;white-space:pre-wrap}.ok{color:#0a6b0a}.note{color:#555;font-size:12px}.warn{color:#8a5a00}
 code{font-size:11px}
</style>
</head>
<body>
<main>
<h1>Происхождение анализов проекта</h1>
<div class="note" id="head"></div>
<div class="note" id="local"></div>
<div class="row" style="margin:6px 0"><button class="btn" id="reload">Обновить</button></div>
<div class="grid"><table class="g" id="list"><thead><tr><th>Образец</th><th>Когда</th><th>Кто</th><th>Версия алгоритма</th><th>FSA (SHA-256)</th><th>Настройки (SHA-256)</th><th>Лабораторный профиль</th><th>Ревизия</th></tr></thead><tbody></tbody></table></div>
<div id="detail"></div>
</main>
<script src="/desktop/provenance.js"></script>
</body>
</html>
