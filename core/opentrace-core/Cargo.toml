[package]
name = "opentrace-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenTrace analysis core: trace preparation, SG peak detection (ports of the Python reference)"

[lib]
crate-type = ["rlib"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-rational = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
roxmltree = "0.20"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2.191"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
libm = { version = "0.2", optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
des = "0.8"
# Allocator: the analysis builds and drops large serde_json trees; mimalloc is markedly faster than the system
# allocators here (glibc malloc_consolidate, Windows HeapAlloc). Results do not depend on the allocator.
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# fast-alloc: mimalloc as the global allocator of every binary linking the core (CLI, Desktop, Server)
default = ["fast-alloc"]
fast-alloc = ["dep:mimalloc"]
# Pure-Rust libm (musl port) instead of the platform C library: identical bits on Windows/Linux. Opt-in until the
# golden corpora prove it equal to glibc on Linux (see docs/desktop/BASELINE_AUDIT.md, "Numerical portability").
portable-math = ["dep:libm"]
# Platform C library for exp/log/pow too (results then depend on OS and CPU; for comparisons only).
system-libm = []
