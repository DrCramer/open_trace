[package]
name = "opentrace-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenTrace analysis core: trace preparation, SG peak detection (ports of the Python reference)"

[lib]
crate-type = ["rlib"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-rational = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
roxmltree = "0.20"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2.191"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
